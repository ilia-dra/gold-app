name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Project & Inject Code
        run: |
          flutter create --org com.ilia.goldbot --project-name goldbot my_app
          cd my_app
          flutter pub add http
          flutter pub add url_launcher
          flutter pub add shared_preferences

          # تنظیم دسترسی اینترنت و باز کردن مستقیم چارت در مرورگر اندروید
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/manifest>/i \    <queries><intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent></queries>' android/app/src/main/AndroidManifest.xml

          # کلید امضای ثابت برای امکان آپدیت مستقیم بدون حذف نسخه قبل
          mkdir -p ~/.android
          keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048

          cp ../lib/main.dart lib/main.dart

          # بیلد با افزایش خودکار شماره نسخه
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Goldbot-Release-APK
          path: my_app/build/app/outputs/flutter-apk/app-release.apk
